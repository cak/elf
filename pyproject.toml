[project]
name = "elf"
version = "0.2.0"
description = "Advent of Code helper for Python: fetch and cache inputs, submit answers, and pull private leaderboards."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "cak", email = "cak@typeerror.com" }
]
requires-python = ">=3.11"

dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

keywords = [
    "advent of code",
    "aoc",
    "cli",
    "python",
    "puzzles",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/snally-dev/elf"
Documentation = "https://github.com/snally-dev/elf/"
Repository = "https://github.com/snally-dev/elf"
Issue-Tracker = "https://github.com/snally-dev/elf/issues"

[project.scripts]
elf = "elf.cli:main"

[tool.setuptools.packages.find]
include = ["elf*"]

[tool.setuptools.package-data]
elf = ["py.typed"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
